[project]
name = "cablesizecalculatormcp"
version = "0.1.0"
description = "Experimental AC cable-sizing MCP server with operator-supplied reference data"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0,<3",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
cablesizecalculator = "cablesizecalculator.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cablesizecalculator"]

[tool.pytest.ini_options]
addopts = "-s -v"
pythonpath = ["src"]

